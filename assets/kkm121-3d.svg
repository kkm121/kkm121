<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="50%" stop-color="#0a1526"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Chrome Metallic Face Gradient -->
    <linearGradient id="chrome3DFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#bae6fd"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- 3D Extrusion Side Gradients -->
    <linearGradient id="extDeep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="extMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Shimmer Glow Animation -->
    <linearGradient id="shimmerEffect" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
      <animate attributeName="x1" from="-100%" to="200%" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0%" to="300%" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Simple Standard Blur Filter (Camo Compliant) -->
    <filter id="camoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes gentleFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseLight {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.85; }
      }
      .floating-layer {
        animation: gentleFloat 4s ease-in-out infinite;
      }
      .pulse-glow {
        animation: pulseLight 3s ease-in-out infinite;
      }
      .text-bold-3d {
        font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 900;
        letter-spacing: 8px;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>

  <!-- Cyber 3D Perspective Floor Grid -->
  <g stroke="#38bdf8" stroke-width="0.8" opacity="0.18">
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="265" x2="1200" y2="265"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="345" x2="1200" y2="345"/>

    <line x1="600" y1="230" x2="50" y2="360"/>
    <line x1="600" y1="230" x2="250" y2="360"/>
    <line x1="600" y1="230" x2="450" y2="360"/>
    <line x1="600" y1="230" x2="750" y2="360"/>
    <line x1="600" y1="230" x2="950" y2="360"/>
    <line x1="600" y1="230" x2="1150" y2="360"/>
  </g>

  <!-- Glowing Ambient Background Stars -->
  <g fill="#38bdf8" class="pulse-glow">
    <circle cx="150" cy="70" r="1.5" opacity="0.7"/>
    <circle cx="350" cy="110" r="2" opacity="0.5"/>
    <circle cx="520" cy="60" r="1.5" opacity="0.8"/>
    <circle cx="780" cy="80" r="2" opacity="0.6"/>
    <circle cx="950" cy="50" r="1.5" opacity="0.9"/>
    <circle cx="1080" cy="110" r="2" opacity="0.5"/>
  </g>

  <!-- ══════════════════ 3D EXTRUDED FLOATING TYPOGRAPHY ══════════════════ -->
  <g class="floating-layer">

    <!-- 3D Extruded Depth Layers (Back to Front) -->
    <text x="600" y="194" font-size="124" class="text-bold-3d" fill="#010a14" opacity="0.9">KKM121</text>
    <text x="600" y="190" font-size="124" class="text-bold-3d" fill="#021529" opacity="0.9">KKM121</text>
    <text x="600" y="186" font-size="124" class="text-bold-3d" fill="#042747" opacity="0.95">KKM121</text>
    <text x="600" y="182" font-size="124" class="text-bold-3d" fill="url(#extDeep)">KKM121</text>
    <text x="600" y="178" font-size="124" class="text-bold-3d" fill="url(#extMid)">KKM121</text>
    <text x="600" y="174" font-size="124" class="text-bold-3d" fill="url(#extDeep)">KKM121</text>
    <text x="600" y="170" font-size="124" class="text-bold-3d" fill="#0284c7">KKM121</text>

    <!-- Neon Edge Glow Stroke -->
    <text x="600" y="166" font-size="124" class="text-bold-3d" fill="none" stroke="#38bdf8" stroke-width="6" opacity="0.75" filter="url(#camoGlow)">KKM121</text>
    <text x="600" y="166" font-size="124" class="text-bold-3d" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.9">KKM121</text>

    <!-- 3D Front Face -->
    <text x="600" y="166" font-size="124" class="text-bold-3d" fill="url(#chrome3DFace)">KKM121</text>

    <!-- Animated Shimmer Layer -->
    <text x="600" y="166" font-size="124" class="text-bold-3d" fill="url(#shimmerEffect)">KKM121</text>

    <!-- Chrome Bevel Top Highlight -->
    <text x="600" y="166" font-size="124" class="text-bold-3d" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.75">KKM121</text>

    <!-- Subtitle Line -->
    <text x="600" y="218" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="9" text-anchor="middle" opacity="0.9">
      COMPUTER SCIENCE &bull; REINFORCEMENT LEARNING &bull; QUANTUM-INSPIRED SYSTEMS
    </text>
  </g>

  <!-- 3D Ground Reflection -->
  <g transform="translate(0, 375) scale(1, -0.4)" opacity="0.22">
    <text x="600" y="166" font-size="124" class="text-bold-3d" fill="url(#chrome3DFace)">KKM121</text>
  </g>

  <!-- Border Frame -->
  <rect width="1200" height="360" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3"/>
</svg>