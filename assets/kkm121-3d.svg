<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0e2338" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#07111e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="cyanCore" cx="35%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetCore" cx="70%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D Text Metallic Chrome Face Gradient -->
    <linearGradient id="chromeFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#cffafe"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#818cf8"/>
      <stop offset="90%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#fdf4ff"/>
    </linearGradient>

    <!-- 3D Extrusion Side Gradient -->
    <linearGradient id="extrusionSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Animated Shimmer Gradient -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
      <animate attributeName="x1" from="-100%" to="200%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0%" to="300%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Glass Reflection Floor Gradient -->
    <linearGradient id="floorFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030712" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#030712" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </linearGradient>

    <!-- Filters: Neon Glow & Shadow -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="drop3D" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#00f2fe" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="30" stdDeviation="25" flood-color="#7c3aed" flood-opacity="0.3"/>
    </filter>

    <style>
      @keyframes float3D {
        0%, 100% { transform: translateY(0px) rotateX(2deg); }
        50% { transform: translateY(-10px) rotateX(0deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 0.95; }
      }
      @keyframes particleFloat {
        0% { transform: translateY(0px); opacity: 0.2; }
        50% { opacity: 0.9; }
        100% { transform: translateY(-30px); opacity: 0.2; }
      }
      .floating-3d {
        animation: float3D 5s ease-in-out infinite;
        transform-origin: center center;
      }
      .glow-pulse {
        animation: pulseGlow 3.5s ease-in-out infinite;
      }
      .text-3d {
        font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        letter-spacing: 6px;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGlow)"/>
  <rect width="1200" height="380" rx="16" fill="url(#cyanCore)" class="glow-pulse"/>
  <rect width="1200" height="380" rx="16" fill="url(#violetCore)" class="glow-pulse" style="animation-delay: 1.8s;"/>

  <!-- Grid Perspective Lines for 3D Cyber Horizon -->
  <g stroke="#38bdf8" stroke-width="0.75" opacity="0.15">
    <line x1="0" y1="260" x2="1200" y2="260"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="310" x2="1200" y2="310"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    
    <line x1="600" y1="250" x2="100" y2="380"/>
    <line x1="600" y1="250" x2="300" y2="380"/>
    <line x1="600" y1="250" x2="500" y2="380"/>
    <line x1="600" y1="250" x2="700" y2="380"/>
    <line x1="600" y1="250" x2="900" y2="380"/>
    <line x1="600" y1="250" x2="1100" y2="380"/>
  </g>

  <!-- Ambient Light Particles -->
  <g fill="#38bdf8">
    <circle cx="180" cy="80" r="1.5" opacity="0.6"/>
    <circle cx="320" cy="140" r="2" opacity="0.4"/>
    <circle cx="480" cy="70" r="1.5" opacity="0.8"/>
    <circle cx="720" cy="110" r="2.5" opacity="0.5"/>
    <circle cx="890" cy="60" r="1.5" opacity="0.7"/>
    <circle cx="1040" cy="130" r="2" opacity="0.6"/>
  </g>
  <g fill="#c084fc">
    <circle cx="240" cy="100" r="2" opacity="0.5"/>
    <circle cx="620" cy="50" r="2" opacity="0.7"/>
    <circle cx="820" cy="90" r="2" opacity="0.6"/>
    <circle cx="980" cy="75" r="1.5" opacity="0.8"/>
  </g>

  <!-- ══════════════════ 3D FLOATING WORDMARK GROUP ══════════════════ -->
  <g class="floating-3d">

    <!-- 3D Extrusion Shadow Layers (Back to Front) -->
    <g fill="#021424" opacity="0.8">
      <text x="600" y="200" font-size="130" class="text-3d">KKM121</text>
    </g>
    <g fill="#042038" opacity="0.85">
      <text x="600" y="196" font-size="130" class="text-3d">KKM121</text>
    </g>
    <g fill="#083358" opacity="0.9">
      <text x="600" y="192" font-size="130" class="text-3d">KKM121</text>
    </g>
    <g fill="url(#extrusionSide)">
      <text x="600" y="188" font-size="130" class="text-3d">KKM121</text>
      <text x="600" y="184" font-size="130" class="text-3d">KKM121</text>
      <text x="600" y="180" font-size="130" class="text-3d">KKM121</text>
      <text x="600" y="176" font-size="130" class="text-3d">KKM121</text>
      <text x="600" y="172" font-size="130" class="text-3d">KKM121</text>
    </g>

    <!-- Neon Glow Outline -->
    <text x="600" y="168" font-size="130" class="text-3d" fill="none" stroke="#38bdf8" stroke-width="6" filter="url(#neonGlow)" opacity="0.85">KKM121</text>
    <text x="600" y="168" font-size="130" class="text-3d" fill="none" stroke="#c084fc" stroke-width="3" filter="url(#neonGlow)" opacity="0.9">KKM121</text>

    <!-- 3D Front Face -->
    <text x="600" y="168" font-size="130" class="text-3d" fill="url(#chromeFace)" filter="url(#drop3D)">KKM121</text>
    
    <!-- Shimmer Top Overlay -->
    <text x="600" y="168" font-size="130" class="text-3d" fill="url(#shimmer)">KKM121</text>

    <!-- Chrome Inner Highlight Bevel -->
    <text x="600" y="168" font-size="130" class="text-3d" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.8">KKM121</text>

    <!-- Subtitle / Tagline in Futuristic Tracked Type -->
    <text x="600" y="222" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="10" text-anchor="middle" opacity="0.95">
      AI RESEARCHER &bull; REINFORCEMENT LEARNING &bull; MULTI-AGENT SYSTEMS
    </text>
  </g>

  <!-- ══════════════════ 3D FLOOR REFLECTION ══════════════════ -->
  <g transform="translate(0, 395) scale(1, -0.45)" opacity="0.28" filter="url(#neonGlow)">
    <text x="600" y="168" font-size="130" class="text-3d" fill="url(#chromeFace)">KKM121</text>
  </g>
  <rect x="0" y="245" width="1200" height="135" fill="url(#floorFade)"/>

  <!-- Border Accent -->
  <rect width="1200" height="380" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>
</svg>