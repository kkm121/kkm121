<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="40%" stop-color="#0a192f"/>
      <stop offset="80%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#14365d"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="85%" cy="20%" r="35%">
      <stop offset="0%" stop-color="#cce7ff" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#70a6ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#050b14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="horizonGlow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#1e293b" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes snowfall-1 {
        0% { transform: translate(0, -20px); opacity: 0; }
        15% { opacity: 0.9; }
        85% { opacity: 0.9; }
        100% { transform: translate(-80px, 440px); opacity: 0; }
      }
      @keyframes snowfall-2 {
        0% { transform: translate(0, -20px); opacity: 0; }
        20% { opacity: 0.75; }
        80% { opacity: 0.75; }
        100% { transform: translate(60px, 440px); opacity: 0; }
      }
      @keyframes snowfall-3 {
        0% { transform: translate(0, -20px); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translate(-40px, 440px); opacity: 0; }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      .flake-1 { animation: snowfall-1 6s linear infinite; }
      .flake-2 { animation: snowfall-2 9s linear infinite; }
      .flake-3 { animation: snowfall-3 12s linear infinite; }
      .star { animation: twinkle 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Sky -->
  <rect width="1200" height="420" rx="16" fill="url(#nightSky)"/>
  <rect width="1200" height="420" rx="16" fill="url(#moonGlow)"/>
  <rect width="1200" height="420" rx="16" fill="url(#horizonGlow)"/>

  <!-- Distant Mountains -->
  <path d="M0 420 L150 280 L350 360 L580 240 L820 350 L1050 260 L1200 340 L1200 420 Z" fill="#071527" opacity="0.8"/>
  <path d="M0 420 L220 320 L480 380 L720 300 L960 370 L1200 310 L1200 420 Z" fill="#0b223d" opacity="0.9"/>
  <path d="M0 420 L300 360 L650 400 L950 350 L1200 380 L1200 420 Z" fill="#0f2d50"/>

  <!-- Moon -->
  <circle cx="1020" cy="90" r="38" fill="#f0f9ff" opacity="0.95"/>
  <circle cx="1020" cy="90" r="48" fill="#7dd3fc" opacity="0.15"/>
  <circle cx="1020" cy="90" r="70" fill="#38bdf8" opacity="0.08"/>

  <!-- Distant Stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="60" r="1.5" class="star" style="animation-delay: 0.2s;"/>
    <circle cx="240" cy="110" r="1" class="star" style="animation-delay: 1.1s;"/>
    <circle cx="380" cy="45" r="2" class="star" style="animation-delay: 0.7s;"/>
    <circle cx="520" cy="95" r="1.2" class="star" style="animation-delay: 2.1s;"/>
    <circle cx="680" cy="50" r="1.8" class="star" style="animation-delay: 1.5s;"/>
    <circle cx="840" cy="120" r="1" class="star" style="animation-delay: 0.4s;"/>
    <circle cx="950" cy="40" r="1.5" class="star" style="animation-delay: 1.9s;"/>
    <circle cx="1120" cy="160" r="1.2" class="star" style="animation-delay: 0.8s;"/>
  </g>

  <!-- Animated Snowfall Layers -->
  <!-- Layer 1: Fast & Small -->
  <g fill="#e0f2fe" class="flake-1">
    <circle cx="80" cy="-10" r="2.5" style="animation-delay: 0s;"/>
    <circle cx="210" cy="-10" r="2" style="animation-delay: 1.2s;"/>
    <circle cx="340" cy="-10" r="3" style="animation-delay: 2.4s;"/>
    <circle cx="470" cy="-10" r="2.2" style="animation-delay: 0.6s;"/>
    <circle cx="610" cy="-10" r="2.8" style="animation-delay: 3.1s;"/>
    <circle cx="750" cy="-10" r="2" style="animation-delay: 1.8s;"/>
    <circle cx="890" cy="-10" r="3.2" style="animation-delay: 4.2s;"/>
    <circle cx="1030" cy="-10" r="2.4" style="animation-delay: 0.9s;"/>
    <circle cx="1160" cy="-10" r="2" style="animation-delay: 2.7s;"/>
  </g>

  <!-- Layer 2: Medium Drift -->
  <g fill="#bae6fd" class="flake-2">
    <circle cx="140" cy="-10" r="3.5" style="animation-delay: 0.5s;"/>
    <circle cx="290" cy="-10" r="4" style="animation-delay: 3.5s;"/>
    <circle cx="430" cy="-10" r="3.2" style="animation-delay: 1.5s;"/>
    <circle cx="560" cy="-10" r="4.5" style="animation-delay: 6.2s;"/>
    <circle cx="710" cy="-10" r="3.8" style="animation-delay: 2.8s;"/>
    <circle cx="830" cy="-10" r="4.2" style="animation-delay: 4.8s;"/>
    <circle cx="980" cy="-10" r="3.6" style="animation-delay: 7.1s;"/>
    <circle cx="1110" cy="-10" r="4" style="animation-delay: 1.1s;"/>
  </g>

  <!-- Layer 3: Slow & Soft -->
  <g fill="#ffffff" opacity="0.85" class="flake-3">
    <circle cx="60" cy="-10" r="5" style="animation-delay: 2.0s;"/>
    <circle cx="250" cy="-10" r="4.8" style="animation-delay: 7.5s;"/>
    <circle cx="490" cy="-10" r="5.5" style="animation-delay: 0.2s;"/>
    <circle cx="670" cy="-10" r="4.2" style="animation-delay: 4.3s;"/>
    <circle cx="880" cy="-10" r="5.2" style="animation-delay: 9.1s;"/>
    <circle cx="1060" cy="-10" r="4.6" style="animation-delay: 3.7s;"/>
  </g>

  <!-- Overlay Frame / Vignette -->
  <rect width="1200" height="420" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3"/>
</svg>
